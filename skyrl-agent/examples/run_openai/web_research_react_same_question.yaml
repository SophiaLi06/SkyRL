agent_cls: skyrl_agent.agents.react.ReActAgent

task: skyrl_agent.tasks.web_research_task.WebResearchTask

tools: ["finish", "search_engine", "web_browser"]


data:
  data_source_key: data_source

generator:
  infer_backend: openai_server
  backend_config:
    model_name: Qwen/Qwen3-8B
    api_url: http://localhost:8000
    model_max_len: 32768
  num_trajectories: 1
  max_iterations: 20
  max_prompt_length: 31232
  sampling_params:
    temperature: 0.5
    top_p: 0.95
    max_tokens: 31232
  val_config:
    # This is the field that actually applies -- run_web_research_react.py
    # always calls run(dataset, val_mode=True), and AgentRunner.run() reads
    # generator.val_config.num_trajectories (not the top-level one above)
    # whenever val_mode=True. 8 samples per question, same as the real
    # GRPO training config (skyrl_web_research_hle.yaml), for measuring
    # duplicate-query/URL overlap across concurrent rollouts of the same prompt.
    num_trajectories: 8
    sampling_params:
      temperature: 1
      top_p: 0.95
      max_tokens: 31232
  remove_think_tokens: false
  vision_is_active: false
  qwen3_enable_thinking: true
  qwen3_acc_thinking: true
  early_step_threshold: 7
  enable_turn_reminder: true

dispatcher:
  type: async_batch
  scheduler: naive
  # 2 rows x 8 trajectories = 16 total; raised from 8 so all 16 can run
  # concurrently rather than in two waves, maximizing overlap-in-time.
  max_parallel_agents: 16
  max_eval_parallel_agents: 16
